name: Lint

on:
  push:
    branches: [main]
    paths:
      - "auto-codex/**"
      - "auto-codex-ui/**"
      - "tests/**"
      - "scripts/**"
      - ".github/workflows/**"
      - "pyproject.toml"
      - "ruff.toml"
      - "auto-codex/requirements*.lock"
      - "tests/requirements-test*.lock"
      - "auto-codex-ui/pnpm-lock.yaml"
      - "auto-codex-ui/package.json"
  pull_request:
    branches: [main]
    paths:
      - "auto-codex/**"
      - "auto-codex-ui/**"
      - "tests/**"
      - "scripts/**"
      - ".github/workflows/**"
      - "pyproject.toml"
      - "ruff.toml"
      - "auto-codex/requirements*.lock"
      - "tests/requirements-test*.lock"
      - "auto-codex-ui/pnpm-lock.yaml"
      - "auto-codex-ui/package.json"

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  # Python linting
  python:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install ruff
        run: pip install "ruff==0.8.3"

      - name: Detect changed Python files
        id: changed_py
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            base_ref="${{ github.base_ref }}"
            git fetch --no-tags --depth=1 origin "${base_ref}"
            range="origin/${base_ref}...HEAD"
          else
            before="${{ github.event.before }}"
            after="${{ github.sha }}"
            if [[ -n "${before}" && "${before}" != "0000000000000000000000000000000000000000" ]]; then
              range="${before}...${after}"
            else
              range="${after}"
            fi
          fi

          echo "Using diff range: ${range}"
          changed_files="$(git diff --name-only "${range}" | grep -E '^auto-codex/.+\.py$' || true)"

          if [[ -z "${changed_files}" ]]; then
            echo "has_files=false" >> "$GITHUB_OUTPUT"
            echo "No changed Python files under auto-codex/."
            exit 0
          fi

          printf '%s\n' "${changed_files}" > /tmp/changed-python-files.txt
          file_count="$(wc -l < /tmp/changed-python-files.txt | tr -d '[:space:]')"
          echo "has_files=true" >> "$GITHUB_OUTPUT"
          echo "file_count=${file_count}" >> "$GITHUB_OUTPUT"
          echo "Changed Python files (${file_count}):"
          cat /tmp/changed-python-files.txt

      - name: Run ruff check
        if: steps.changed_py.outputs.has_files == 'true'
        run: tr '\n' '\0' < /tmp/changed-python-files.txt | xargs -0 ruff check --output-format=github

  # TypeScript/React linting
  frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.26.1

      - name: Install dependencies
        working-directory: auto-codex-ui
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Run ESLint
        working-directory: auto-codex-ui
        run: pnpm lint

      - name: Run TypeScript check
        working-directory: auto-codex-ui
        run: pnpm typecheck
